name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      send_wecom:
        description: "Send the WeCom operations digest after deployment"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update operational data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node --version
          node scripts/update-weather-data.mjs
          node scripts/update-fx-data.mjs

      - name: Commit operational data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/weather-data.json assets/weather-data.js assets/fx-data.json assets/fx-data.js
          if git diff --cached --quiet; then
            echo "No operational data changes to commit."
          else
            git commit -m "Update operational data"
            git push
          fi

      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -R assets _site/assets
          cp -R us ca au fx _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send WeCom operations digest
        if: >-
          ${{
            github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && inputs.send_wecom == true) ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, '[wecom-test]'))
          }}
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: node scripts/send-wecom-digest.mjs
