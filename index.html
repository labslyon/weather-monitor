<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>跨市场天气运营看板</title>
    <meta name="description" content="美国、加拿大和澳大利亚 16 个运营监测点天气趋势总览。">
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body data-page="overview">
    <header class="app-header">
      <div class="header-inner">
        <div>
          <p class="eyebrow">Weather Operations</p>
          <h1>跨市场天气运营看板</h1>
          <p class="subtitle">美国、加拿大、澳大利亚 16 个运营监测点天气趋势总览</p>
        </div>
        <dl class="header-stats" aria-label="数据概览">
          <div>
            <dt>快照日期</dt>
            <dd id="statDates">--</dd>
          </div>
          <div>
            <dt>监测点</dt>
            <dd id="statCities">--</dd>
          </div>
          <div>
            <dt>生成时间</dt>
            <dd id="statGenerated">--</dd>
          </div>
        </dl>
        <nav class="header-nav" id="headerNav" aria-label="顶部导航">
          <a class="active" href="./" aria-current="page">总览</a>
          <a href="us/">美国</a>
          <a href="ca/">加拿大</a>
          <a href="au/">澳大利亚</a>
        </nav>
      </div>
    </header>

    <main class="shell">
      <section class="overview-section" id="overviewSection" aria-labelledby="overviewTitle">
        <div class="section-head overview-head">
          <div>
            <p class="eyebrow">Market Overview</p>
            <h2 id="overviewTitle">运营总览</h2>
          </div>
          <span class="overview-date" id="overviewDate">--</span>
        </div>
        <div class="overview-signals" id="overviewSignals" aria-label="跨市场天气信号"></div>
        <div class="market-overview" id="marketOverview" aria-label="国家天气总览"></div>
      </section>
    </main>

    <footer class="footer">
      Data source: Open-Meteo. Historical snapshots were extracted from the original AgentOS page.
    </footer>

    <script src="assets/weather-data.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
